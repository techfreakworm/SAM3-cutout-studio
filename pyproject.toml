[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sam3-cutout-studio"
version = "0.1.0"
description = "SAM3 Cutout Studio: text-guided video cutouts with SAM 3.1 and ViTMatte"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "numpy==1.26.4",
  "pillow==12.3.0",
  "opencv-python-headless==4.10.0.84",
  "av==18.0.0",
  "transformers==5.14.1",
  "huggingface-hub==1.25.1",
  "safetensors==0.8.0",
  "gradio[oauth]==6.20.0",
  "spaces==0.51.1",
  "psutil==7.2.2",
  "scipy==1.17.0",
  "timm==1.0.24",
  "einops==0.8.1",
  "pycocotools==2.0.10",
  "ftfy==6.1.1",
  "iopath==0.1.10",
  "sam3 @ git+https://github.com/facebookresearch/sam3.git@46957e47805eaa273f4aa7bbbd25a88bca9108ce",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.14",
]

[project.urls]
Repository = "https://github.com/techfreakworm/SAM3-cutout-studio"
"Hugging Face Space" = "https://huggingface.co/spaces/techfreakworm/SAM3-cutout-studio"

[tool.hatch.build.targets.wheel]
packages = ["src/sam3_matting"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["sam3_matting"]
